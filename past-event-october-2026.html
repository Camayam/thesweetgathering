<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sweet Gathering, October 2026 — Past Events</title>
  <meta name="description" content="A look back at The Sweet Gathering in October 2026: freshly baked delights and good conversations.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .event-page {
      max-width: 1000px;
    }

    .event-back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--jam);
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .event-detail-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .event-detail-header .section-title {
      margin-bottom: 0.35rem;
    }

    .event-detail-date {
      color: var(--sage);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .event-detail-photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .event-photo-carousel {
      max-width: 850px;
      margin: 0 auto;
    }

    .event-photo-carousel .gallery-track .photo-slot {
      width: min(82%, 680px);
    }

    .event-photo-carousel .photo-placeholder {
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      box-shadow: 0 16px 34px rgba(59, 42, 46, 0.16);
    }

    .event-photo-carousel .photo-slot figcaption {
      font-family: var(--font-display);
      color: var(--ink);
    }

    .event-poster {
      margin: 2.5rem auto 0;
      text-align: center;
    }

    .event-poster-image {
      display: block;
      width: min(100%, 430px);
      height: auto;
      margin: 0 auto;
      border: 1px solid rgba(116, 93, 60, 0.18);
      border-radius: 16px;
      box-shadow: 0 16px 34px rgba(59, 42, 46, 0.16);
    }

    .event-detail-copy {
      max-width: 680px;
      margin: 1.8rem auto 0;
      text-align: center;
      line-height: 1.75;
    }

    @media (max-width: 560px) {
      .event-photo-carousel .gallery-track .photo-slot { width: 88%; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="top-bar-logo" href="index.html" aria-label="The Sweet Gathering home">
        <img src="assets/Logo_The Sweet Gathering.png" alt="The Sweet Gathering logo" onerror="this.style.display='none'">
      </a>

      <div class="top-bar-menu">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Open menu">
          <span>Menu</span>
          <span class="menu-caret">▾</span>
        </button>
        <nav class="menu-panel" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="past-events.html">Past Events</a>
          <a href="faq.html">FAQ</a>
          <a href="about.html">About Us</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="card-frame event-page">
    <a class="event-back-link" href="past-events.html">&larr; All past events</a>

    <header class="event-detail-header">
      <p class="event-detail-date">October 2026</p>
      <h1 class="section-title">The Sweet Gathering</h1>
      <p class="section-note">Freshly baked delights, new faces, and good conversations.</p>
    </header>

    <section class="event-photo-carousel" aria-label="Photos from The Sweet Gathering">
      <div class="carousel">
        <button class="carousel-arrow prev" type="button" aria-label="Previous event photo">&#8249;</button>
        <div class="gallery-track" id="galleryTrack">
          <figure class="photo-slot">
            <div class="photo-placeholder">
              <img class="event-detail-photo" src="assets/past-events/october-2026/thesweetgathering.jpeg" alt="The Sweet Gathering table filled with homemade cakes and baked treats" fetchpriority="high">
            </div>
            <figcaption>Freshly baked delights</figcaption>
          </figure>
          <figure class="photo-slot">
            <div class="photo-placeholder">
              <img class="event-detail-photo" src="assets/past-events/october-2026/cs4.jpeg" alt="A colourful spread of cakes and desserts at the event" loading="lazy">
            </div>
            <figcaption>A table made for sharing</figcaption>
          </figure>
        </div>
        <button class="carousel-arrow next" type="button" aria-label="Next event photo">&#8250;</button>
      </div>
      <div class="carousel-dots" id="galleryDots" aria-label="Choose an event photo"></div>
    </section>

    <section class="event-poster" aria-labelledby="event-poster-title">
      <h2 class="section-title" id="event-poster-title">Event poster</h2>
      <img
        class="event-poster-image"
        src="assets/past-events/october-2026/october-2026.jpeg"
        alt="Poster for the first edition of The Sweet Gathering on 4 October 2026"
        loading="lazy"
      >
    </section>

      <p class="artwork-credit">Artwork by <a href="https://www.behance.net/lisa-poort?locale=nl_NL" target="_blank" rel="noopener noreferrer">Lisa Poort</a></p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
